name: ${COMPOSE_PROJECT_NAME:-algia_cabinet_client01}

x-app-env: &app-env
  TZ: ${TZ}
  APP_IMAGE: ${APP_IMAGE}
  APP_VERSION: ${APP_VERSION}
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
  SITE_NAME: ${SITE_NAME}
  SITE_HOST: ${SITE_HOST}
  HTTP_PORT: ${HTTP_PORT}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL}
  REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
  REDIS_SOCKETIO_URL: ${REDIS_SOCKETIO_URL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  INSTALL_APPS: ${INSTALL_APPS}
  SOCKETIO_PORT: ${SOCKETIO_PORT}
  BACKEND_PORT: ${BACKEND_PORT}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}

services:
  db:
    image: mariadb:10.6
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p${DB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis_cache_data:/data

  redis-queue:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_queue
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis_queue_data:/data

  redis-socketio:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_socketio
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis_socketio_data:/data

  configurator:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_configurator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
    environment: *app-env
    entrypoint:
      - /bin/bash
      - /bootstrap/configurator.sh
    command: []
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./bootstrap/configurator.sh:/bootstrap/configurator.sh:ro

  create-site:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_create_site
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
      configurator:
        condition: service_completed_successfully
    environment: *app-env
    entrypoint:
      - /bin/bash
      - /bootstrap/create-site.sh
    command: []
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./bootstrap/create-site.sh:/bootstrap/create-site.sh:ro

  backend:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
    command:
      - bash
      - -c
      - |
        /home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=0.0.0.0:8000 --threads=4 --workers=2 --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=120 frappe.app:application --preload
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_websocket
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      <<: *app-env
      FRAPPE_REDIS_CACHE: ${REDIS_CACHE_URL}
      FRAPPE_REDIS_QUEUE: ${REDIS_QUEUE_URL}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-short:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_queue_short
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      <<: *app-env
      FRAPPE_REDIS_CACHE: ${REDIS_CACHE_URL}
      FRAPPE_REDIS_QUEUE: ${REDIS_QUEUE_URL}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-long:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_queue_long
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      <<: *app-env
      FRAPPE_REDIS_CACHE: ${REDIS_CACHE_URL}
      FRAPPE_REDIS_QUEUE: ${REDIS_QUEUE_URL}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  scheduler:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_scheduler
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command:
      - bench
      - schedule
    environment: *app-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  frontend:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_frontend
    restart: unless-stopped
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      <<: *app-env
      BACKEND: ${COMPOSE_PROJECT_NAME}_backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      SOCKETIO: ${COMPOSE_PROJECT_NAME}_websocket:${SOCKETIO_PORT}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 100m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PORT}:8080"

volumes:
  db_data:
  redis_cache_data:
  redis_queue_data:
  redis_socketio_data:
  sites:
  logs:
